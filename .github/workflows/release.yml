name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 설치본을 만들 플랫폼
        type: choice
        options:
          - all
          - windows
        default: all
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows (x64)
            platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        if: inputs.platform != 'windows' || matrix.platform == 'windows-latest'
        run: npm ci

      - name: Build and upload desktop installers
        if: inputs.platform != 'windows' || matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: WITHIN SOOP v__VERSION__
          releaseBody: |
            각자의 자리에서 조용히 함께 작업하기 위한 WITHIN SOOP 데스크톱 설치본입니다.

            - macOS Apple Silicon: aarch64 DMG
            - macOS Intel: x64 DMG
            - Windows x64: NSIS 설치 파일

            이 릴리스는 코드 서명 인증서가 없는 테스트 배포입니다. 운영 배포 전에는 macOS 공증과 Windows 코드 서명을 추가해야 합니다.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
